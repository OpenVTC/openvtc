name: Publish crates

# THE FILENAME OF THIS FILE IS LOAD-BEARING. crates.io Trusted Publishing is
# configured per crate against a repository + workflow FILENAME (+ the
# `release` environment below). Every crate in this workspace is registered
# against `OpenVTC/openvtc`, `publish.yml`, environment `release`. Renaming the
# file makes the OIDC exchange fail before anything publishes
# (verifiable-trust-infrastructure learnt this the hard way).
#
# Publishes the workspace to crates.io from a release branch (RELEASES.md):
#
#   * only when RELEASE exists (release branches only), names a GA or patch
#     version (`X.Y.Z`; an rc publishes nothing), and equals the workspace
#     version — a mismatch fails the run rather than publishing the wrong thing;
#   * only crates whose version is not already on crates.io (read from the
#     sparse index), so a push that changes nothing — a backport before its
#     prep PR — is a no-op, and a re-run resumes where a failed one stopped;
#   * in dependency order (derived from `cargo metadata`, see
#     .github/scripts/publish-crates.py `plan`), waiting for each crate to
#     reach the index before its dependents are verified.
#
# Trusted Publishing ONLY: there is no CARGO_REGISTRY_TOKEN secret and no
# fallback to one. A short-lived token is minted per crate by
# rust-lang/crates-io-auth-action and revoked when the job ends.
#
# Token lifetime. A Trusted Publishing token lives 30 minutes, and a cold
# verify build of the openvtc binary takes a good part of that (VTI's release
# lost its 30th crate to `403 Invalid authentication token` exactly 30 minutes
# after the exchange). So the verify build and the upload are separate steps: each slot
# below (1) picks the next unpublished crate and verify-builds it with
# `cargo package` — no token exists yet — then (2) mints a fresh token and
# (3) uploads with `cargo publish --no-verify`, which takes seconds. Every
# crate gets its own token.
#
# Retries. An upload failure (a registry hiccup, an index that is slow to
# show the crate) is `continue-on-error`; the next slot finds the same crate
# still pending, verifies it again (warm, so fast) and retries on a new token.
# There are more slots than crates for exactly that: two crates, four slots,
# so each upload gets one retry. Add slots with crates. A verify-build failure is
# NOT retried — it would fail identically — and stops the job. The final step
# fails the run unless every crate is on crates.io.
#
# A brand-new crate cannot be published this way: a Trusted Publishing token
# can only publish to a crate that exists and lists this workflow as a trusted
# publisher. publish-crates.py stops with an explanation; RELEASES.md
# ("A new crate") has the manual first-publish procedure.

on:
  push:
    branches: ["release/**"]
  # Recovery hatch: re-run the same logic (e.g. after fixing a crates.io-side
  # Trusted Publisher config). Choose the release branch as the ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two publishers on one branch; never cancel one mid-release.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 240
    permissions:
      # OIDC token exchange with crates.io (Trusted Publishing).
      id-token: write
      contents: write
    env:
      CARGO_TERM_COLOR: always
      # Deliberately without `-D warnings`: CI's clippy holds the code to
      # that, and failing a real release half-way through on a lint that
      # appeared upstream since helps nobody.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap and first: decides whether this push publishes anything at all,
      # before a toolchain is installed. Fails (rather than skips) when RELEASE
      # and the workspace version disagree.
      - name: Should this push publish?
        id: gate
        run: python3 .github/scripts/publish-crates.py gate

      - name: Install Rust toolchain
        if: steps.gate.outputs.publish == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        if: steps.gate.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev

      - name: Publish plan
        if: steps.gate.outputs.publish == 'true'
        run: python3 .github/scripts/publish-crates.py plan

      # ---- slot 1 -------------------------------------------------------
      - name: "Slot 1: verify the next crate"
        id: next1
        if: steps.gate.outputs.publish == 'true'
        run: python3 .github/scripts/publish-crates.py next
      - name: "Slot 1: authenticate to crates.io (Trusted Publishing)"
        id: auth1
        if: steps.next1.outputs.crate != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: "Slot 1: upload ${{ steps.next1.outputs.crate }}"
        if: steps.next1.outputs.crate != ''
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth1.outputs.token }}
          CRATE: ${{ steps.next1.outputs.crate }}
        run: python3 .github/scripts/publish-crates.py upload "$CRATE"

      # ---- slot 2 -------------------------------------------------------
      - name: "Slot 2: verify the next crate"
        id: next2
        if: steps.next1.outputs.crate != ''
        run: python3 .github/scripts/publish-crates.py next
      - name: "Slot 2: authenticate to crates.io (Trusted Publishing)"
        id: auth2
        if: steps.next2.outputs.crate != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: "Slot 2: upload ${{ steps.next2.outputs.crate }}"
        if: steps.next2.outputs.crate != ''
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth2.outputs.token }}
          CRATE: ${{ steps.next2.outputs.crate }}
        run: python3 .github/scripts/publish-crates.py upload "$CRATE"

      # ---- slot 3 -------------------------------------------------------
      - name: "Slot 3: verify the next crate"
        id: next3
        if: steps.next2.outputs.crate != ''
        run: python3 .github/scripts/publish-crates.py next
      - name: "Slot 3: authenticate to crates.io (Trusted Publishing)"
        id: auth3
        if: steps.next3.outputs.crate != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: "Slot 3: upload ${{ steps.next3.outputs.crate }}"
        if: steps.next3.outputs.crate != ''
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth3.outputs.token }}
          CRATE: ${{ steps.next3.outputs.crate }}
        run: python3 .github/scripts/publish-crates.py upload "$CRATE"

      # ---- slot 4 -------------------------------------------------------
      - name: "Slot 4: verify the next crate"
        id: next4
        if: steps.next3.outputs.crate != ''
        run: python3 .github/scripts/publish-crates.py next
      - name: "Slot 4: authenticate to crates.io (Trusted Publishing)"
        id: auth4
        if: steps.next4.outputs.crate != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: "Slot 4: upload ${{ steps.next4.outputs.crate }}"
        if: steps.next4.outputs.crate != ''
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth4.outputs.token }}
          CRATE: ${{ steps.next4.outputs.crate }}
        run: python3 .github/scripts/publish-crates.py upload "$CRATE"

      - name: Every crate is on crates.io
        if: steps.gate.outputs.publish == 'true'
        run: python3 .github/scripts/publish-crates.py check-all
