# cargo-deny configuration
#
# Run with `cargo deny check` (or the per-section variants:
#   `cargo deny check advisories`
#   `cargo deny check licenses`
#   `cargo deny check bans`
#   `cargo deny check sources`
# )
#
# CI runs all four. Locally, advisories drift fastest — re-run after
# `cargo update` if you start seeing new warnings.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# Keep this list and `.cargo/audit.toml` in step: same IDs, same reasons. The
# one deliberate difference is RUSTSEC-2026-0330/0331 (libcrux-kem), which only
# cargo-audit sees; see the note there. Prune an entry as soon as it stops
# matching: cargo-deny warns `advisory-not-detected` when one never fires.
# Last checked against the graph: 2026-11-25.
ignore = [
    # rsa: Marvin Attack timing side channel; no patched release. Reached only
    # through `pgp` / `openpgp-card-rpgp` (local OpenPGP card operations, not
    # network-observable RSA). Re-check when `pgp` moves.
    "RUSTSEC-2023-0071",
    # proc-macro-error2: unmaintained build-time proc-macro, no runtime code.
    # Dev graph only: vta-service -> vti-rooms -> openmls_rust_crypto ->
    # hpke-rs -> libcrux-* -> hax-lib-macros. Re-check on the next vta-service bump.
    "RUSTSEC-2026-0173",
    # crypto-bigint 0.5.5: timing variability, fixed only on the 0.7 line.
    # Reached only through `pgp` 0.20 (cx448, elliptic-curve 0.13); no 0.5.x
    # patch exists. Re-check when `pgp` moves.
    "RUSTSEC-2026-0387",
    # chrono / chrono-tz: "unmaintained" notices published 2026-11-17, no
    # vulnerability and no safe upgrade. chrono is a direct dependency and is
    # used throughout the SDK stack (affinidi-*, didwebvh-rs, dtg-credentials,
    # did-git-sign); chrono-tz comes with it. Moving off chrono is an ecosystem
    # change, not ours alone. Re-check on the next SDK bump, or when
    # chronotope/chrono#1768 names a successor. (humantime, RUSTSEC-2026-0542,
    # left the graph and its entry was pruned on 2026-11-25.)
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # bzip2-1.0.6: permissive non-copyleft license used by libbz2-rs-sys
    # (transitive via pgp -> bzip2). Equivalent in practice to BSD/MIT.
    "bzip2-1.0.6",
    # CDLA-Permissive-2.0: permissive Linux Foundation data license used
    # by webpki-roots / webpki-root-certs (transitive via rustls / reqwest).
    "CDLA-Permissive-2.0",
    # MIT-0: MIT with the attribution clause dropped, so strictly more
    # permissive than the MIT already allowed above. Used by borrow-or-share,
    # transitive via trust-tasks-rs / vta-service -> jsonschema -> fluent-uri.
    "MIT-0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
# Crates that legitimately ship multiple versions because the ecosystem
# hasn't fully moved off the older API yet. Add to skip-tree (not skip)
# so we suppress the warning for the whole subtree.
skip = []
skip-tree = [
    # rand 0.8 / 0.9 / 0.10 coexist: this workspace and `pgp` 0.20 are on 0.8
    # (see the root `Cargo.toml`); the SDK stack is on the newer lines.
    # Revisit when `pgp` moves off rand_core 0.6.
    { name = "rand", version = "0.8" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Empty: everything resolves from crates.io. This is the other half of any
# `[patch.crates-io]` git entry in the root `Cargo.toml` (`unknown-git = "deny"`
# fails a patch with no entry here), so the two are edited together.
allow-git = []
