[package]
name = "openvtc-core"
description = "OpenVTC Core Library"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true

[features]
default = ["openpgp-card"]
openpgp-card = [
  "dep:openpgp-card",
  "dep:card-backend-pcsc",
  "dep:openpgp-card-rpgp",
]
# Derives `Arbitrary` on the pure parse-surface config/message/credential
# types so the cargo-fuzz harnesses can do structure-aware fuzzing
# (issue #124). Off by default; nightly fuzz builds opt in. Pulls chrono's
# own `arbitrary` feature for the `LogMessage` timestamp.
arbitrary = ["dep:arbitrary", "chrono/arbitrary"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
arbitrary = { workspace = true, optional = true }
argon2.workspace = true
affinidi-tdk.workspace = true
affinidi-data-integrity.workspace = true
affinidi-did-resolver-cache-sdk.workspace = true
# `health` probes mediator transport URLs over HTTP: resolving a DID proves the
# document is fetchable, not that the transport host behind it answers, and the
# two fail independently.
reqwest = { workspace = true }
# Those transport URLs come from DID documents anyone can publish, so the probe
# client installs the resolver's own DNS guard rather than dialling them as-is.
affinidi-did-web.workspace = true
# `CancellationToken`, for `start_service`'s shutdown hook.
tokio-util = { workspace = true }
# The delivery layer this module now runs on (#189): `-delivery` is the durable
# outbox + `MessagingService`, `-core` the `MessageTransport` contract, `-sdk` the
# `DidCommTransport` implementing it over DIDComm (and surfacing inbound TSP off
# the same multiplexed pickup socket).
affinidi-messaging-delivery = { workspace = true }
affinidi-messaging-core = { workspace = true }
affinidi-messaging-sdk = { workspace = true }
futures-util = { workspace = true }
# The inbound dispatcher compiles `OPENVTC_CATCH_ALL_PATTERN` to decide which
# message types reach the state handler — the delivery layer has no type-routed
# dispatch, so this replaces the framework's `route_regex`.
regex = { workspace = true }
agent-names.workspace = true
base64.workspace = true
bip39.workspace = true
byteorder.workspace = true
chrono.workspace = true
dirs.workspace = true
didwebvh-rs.workspace = true
dtg-credentials.workspace = true
ed25519-dalek-bip32.workspace = true
hkdf.workspace = true
hex.workspace = true
keyring-core.workspace = true
multibase.workspace = true
pgp.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
trust-tasks-rs.workspace = true
trust-tasks-capability-client.workspace = true
url.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true
vta-sdk.workspace = true
zeroize.workspace = true

# Openpgp-Card Support
openpgp-card = { workspace = true, optional = true }
card-backend-pcsc = { workspace = true, optional = true }
openpgp-card-rpgp = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# In-process mediator for integration tests. `memory-backend` keeps the
# whole mediator (config + queue + secrets) in RAM — no Redis sidecar,
# no on-disk fixtures — so `cargo test` stays self-contained. Slow tests
# that spawn the mediator are marked `#[ignore]`; run them with
# `cargo test -- --ignored`.
# Test-mediator fixture: spawns a real `affinidi-messaging-mediator`
# embedded in the test process with the JWT keys, DID document, ACL
# defaults, and local-DID whitelisting set up. Replaces the hand-rolled
# harness that did the same dance manually.
#
# Track this with `affinidi-messaging-sdk`, for the same reason `vta-service`
# below tracks `vta-sdk`: 0.5 is the line built on messaging-sdk 0.22 / TDK 0.12
# / trust-tasks 0.18, and the 0.4 line declares `^0.21.0` / `^0.11` / `^0.17`.
# 0.7 is the line built on messaging-sdk 0.24 / TDK 0.14 / trust-tasks 0.20.
# Leaving it behind puts a second copy of each in the **dev** graph — including
# `trust-tasks-rs`, whose types the messaging sdk carries in its own API.
affinidi-messaging-test-mediator = "0.7"
# In-process MockVta for the bootstrap e2e (VTI#406/#427 test-support seams).
# `vta-service` is the VTA server crate; it carries the credential-vault
# lifecycle tasks (receive/query/archive/delete/restore/purge) + the
# `MockVta::start_provisionable` seams used by the e2e tests. Track this with
# the vta-sdk major: on the 0.36 line this resolves from VTI `main` through the
# root manifest's `[patch.crates-io]` — the published 0.25.1 is still built on
# 0.35 — and the floor moves to the release that publishes it (VTI #1416). 0.25
# was the line built against 0.35, as 0.24 was
# against 0.34, 0.23 against 0.32, 0.19 against 0.27, 0.17 against 0.25, 0.15
# against 0.23 and 0.14 against 0.21. An older line pulls an older sdk into the test build and the two
# disagree about the wire types the e2e tests assert on.
#
# VTI `main` also carries `trust-tasks-rs ^0.20.3` and `affinidi-tdk ^0.14`, which is
# what keeps the **dev** graph from growing the second copy of each that the
# root manifest's notes warn about.
#
# Its `affinidi-messaging-sdk` edge is still on `^0.21` upstream, one line
# behind the runtime graph — but it sits behind the non-default `tsp` feature,
# which the feature list below does not enable, so it pulls nothing in. If
# `tsp` is ever added here, check `cargo tree -d` before assuming it is free.
#
# Moving to 0.15 is what collapsed the *second* vta-sdk this workspace grew when
# the runtime dependency went to 0.23 (#213): 0.14.37 asks for `vta-sdk ^0.21`,
# so `cargo tree -i vta-sdk` reported both 0.21.12 and 0.23.0 and the dev-only
# copy sat one major behind everything it is meant to test against. It is not
# merely untidy — `vti-common` re-exports `vta_sdk::acl::{ActScope,
# ApproveScope, ContextDirection}` as its own public API, so a graph holding two
# sdks has two distinct `ApproveScope` types that do not unify. VTI republished
# this crate for exactly this reason (see its Cargo.toml note on `publish`).
vta-service = { version = "0.25.1", default-features = false, features = ["test-support", "rest", "didcomm"] }
base64 = { workspace = true }
ed25519-dalek-bip32 = { workspace = true }
secrecy = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Mock HTTP server for the agent-name resolve→verify e2e: it serves the
# `/@name` → 302 → DID redirect the `HttpRedirectResolver` follows, so the whole
# chain is exercised without a live host.
wiremock = "0.6"
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[[bench]]
name = "crypto"
harness = false

# The vta-service dev-dependency drags webauthn-rs -> openssl-sys into every
# `cargo test` build. Hosted Windows runners ship no MSVC-linkable OpenSSL,
# so build the vendored copy there; feature unification applies it to the
# whole graph. Linux/macOS keep linking the system library.
[target.'cfg(windows)'.dev-dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
