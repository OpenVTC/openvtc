[workspace]
members = [
  "openvtc-core",
  "openvtc",
]
resolver = "3"

[workspace.package]
description = "Open Verifiable Trust Community (OpenVTC) - First Person Protocol"
version = "0.3.1"
edition = "2024"
publish = false
authors = ["Glenn Gore <glenn@affinidi.com>"]
rust-version = "1.95.0"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/LF-Decentralized-Trust-labs/openvtc"

[workspace.dependencies]
openvtc-core = { version = "0.3", path = "openvtc-core", default-features = false }

# Decentralized Trust Graph Credentials.
#
# Nothing in the vta-sdk graph depends on it, so there is no second copy and no
# type that has to unify across the sdk boundary — openvtc and openvtc-core are
# its only consumers. That is why this line was allowed to lead the VTA/VTC for
# several releases while they sat on 0.1.3; as of this refresh it no longer
# does, because VTI main is on 0.6 as well and the two agree again.
#
# The one thing that always has to be checked when this moves is the *wire*,
# not the types: a peer on an older line still has to verify the credentials we
# issue and we still have to parse theirs. The additions across 0.2–0.6 are all
# `skip_serializing_if = "Option::is_none"` with `default`, so a credential we
# issue serialises to the same JCS bytes as before and older-issued VRC/VMC/VICs
# still parse.
#
# The breaking changes on the way here are `new_vwc()`'s required `task_context`
# argument, strict `WitnessCredential` deserialization, and the VWC `digest`
# divergence from WD-01 — none of which reach us: we call neither constructor,
# handle no VWCs, and `digest_multibase()` / `verify_digest()` have no call
# sites here.
dtg-credentials = "0.6"

aes-gcm = "0.11"
# The one direct requirement in this workspace that was behind its latest
# release. Safe to move even though it derives key material: Argon2id is a
# specified KDF and `derive_argon2_key` calls `hash_password_into`, its plain
# implementation — same algorithm, version and params in, same 32 bytes out. So
# the unlock code and the `ProtectedConfig` seed are byte-identical across the
# bump and every existing config still opens. What 0.6 actually breaks is the
# `password-hash` 0.6 PHC-string surface, which we do not touch.
#
# It does not resolve the 0.5/0.6 duplicate, and is not trying to: 0.5.3 is
# `affinidi-messaging-mediator-common`'s requirement, reaching us through
# `affinidi-messaging-sdk`, and no line we control moves it. The bump puts us on
# the same copy as `vta-service` rather than on the older one.
argon2 = "0.6"
# The floor is set by the graph, not chosen here: `vta-sdk` 0.38 and
# `vta-service` 0.27 both declare `^0.14`, and `affinidi-messaging-test-mediator`
# 0.7 does too. This line only records it.
affinidi-tdk = "0.14"
affinidi-data-integrity = "0.7"
# The delivery layer (D1). Replaced `affinidi-messaging-didcomm-service`, the
# type-routed framework both VTI services had already cut over from (#189).
# `-delivery` is the durable outbox + `MessagingService`; `-core` is the
# `MessageTransport` contract it builds on; `-sdk` supplies `DidCommTransport`, the
# DIDComm implementation of that contract (and the one that also surfaces inbound
# TSP off the same multiplexed pickup socket).
#
# Floor is 0.1.14 (affinidi-tdk-rs #710): the dispatcher acked every inbound
# message unconditionally, and an ack is a *delete* at the mediator — including
# when `subscribers.send` had just reported nobody listening. No subscriber is
# installed for a moment at startup and again on the way down, so whatever
# arrived in those windows was destroyed rather than redelivered. For this repo
# that window's contents are a membership credential or a join reply, which is
# the class of loss `#218`'s pickup-on-connect exists to prevent — and this layer
# was undoing it one level down.
affinidi-messaging-delivery = "0.1.14"
# Floor is 0.1.6: it marks `Protocol` `#[non_exhaustive]` and adds the
# `DIDCommV1` variant. The inbound dispatcher's wildcard arm needs both — on
# 0.1.5 the enum is exhaustively matched already and that arm is an
# unreachable pattern, which `-D warnings` rejects.
affinidi-messaging-core = "0.1.6"
# This crate carries `trust-tasks-rs` types in its own API (`MediatorAcl` reaches
# `atm.trust_tasks().account_update`), so its line is not independent of the one
# below: a copy left on an older trust-tasks is a *second* semver-incompatible
# `trust-tasks-rs` whose types do not unify. 0.24 is the line built on
# trust-tasks 0.20, and it is also what `vta-sdk` 0.38 and
# `affinidi-messaging-test-mediator` 0.7 declare — so it is the graph's floor
# whether or not this line states it.
#
# Older floors are below this one by construction and kept in git history rather
# than as a wall of satisfied constraints. Each named a defect this repo had no
# lever over: 0.19.10 (affinidi-tdk-rs #718) surfaced the websocket close code
# and reason instead of discarding the frame, so a mediator refusing a duplicate
# channel stopped looking like a socket that merely vanished; 0.19.8 (#716) was
# the `force_refresh` drop that made the proactive token refresh rebuild the
# socket *without* refreshing and re-arm at 80% of the time remaining — the
# geometric reconnect cascade behind `#231`–`#234`; and 0.19.4 (#694) was the
# `live_stream_next*` read guard that blocked `stop_websocket` for the remainder
# of a 10s poll window.
affinidi-messaging-sdk = "0.24"
# `StreamExt::next` on the `BoxStream` returned by `MessagingService::subscribe`.
futures-util = "0.3"
# Agent names (DID shortcuts). `agent-names` carries the parse /
# canonicalisation / `alsoKnownAs`-verification half; the resolver's
# `agent-names` feature is NOT default, and a direct dependency here is what
# turns it on — via feature unification — for the shared `DIDCacheClient` the
# TDK hands out. Without it `DIDCacheClient::resolve_any` does not exist.
#
# 0.1.3 is `vta-sdk` 0.27's own requirement, so it is the floor whether or not
# this line states it. Stating it keeps the manifest honest about what the graph
# actually resolves rather than implying 0.1.2 is still viable.
agent-names = "0.1.3"
# The floor names the patch, and 0.8.37 is the one that matters: it is the
# release where **`did:webvh` resolution stops contacting non-public hosts**,
# which is the half of the guard this repo was missing. `did:web` has been
# guarded since 0.8.35 (`affinidi-did-web`, below); webvh — the method every
# persona, VTA and VTC here actually uses — was not, so a DID naming
# `localhost%3A9099` or a public name whose A record is `169.254.169.254` was
# fetched anyway, by `health`, by join and by messaging alike.
#
# `DIDCacheClient::new` now builds both its did:web and did:webvh resolvers from
# one `HostPolicy`, defaulting to `PublicOnly`, and `health` passes the policy
# its probes already run under so resolution and probing cannot disagree (see
# `openvtc-core::health::build_report_with_progress`). A caret below this
# release admits 0.8.36, where the webvh half is simply absent, so the patch is
# the floor rather than a record of what happens to resolve today.
affinidi-did-resolver-cache-sdk = { version = "0.8.37", features = [
  "agent-names",
] }
# The SSRF guard the resolver above already applies to did:web fetches, taken
# directly so `health` can put the same connect-time check on its own probe
# client (`guarded_dns_resolver`). Not a new crate: the resolver pulls in this
# exact version on the same `reqwest` line, so the types unify — which is why
# this line moves with the resolver rather than independently. 0.1.5 moves the
# classifier and the DNS-pinning resolver into the shared `affinidi-net-guard`
# 0.1.0 crate with the public API unchanged, so `guarded_dns_resolver` and the
# `HostPolicy` this workspace hands to the resolver behave exactly as on 0.1.4.
affinidi-did-web = "0.1.5"
# The guard `affinidi-did-web` 0.1.5 was refactored onto, taken directly for one
# thing only: `blocked_in_chain`, which recovers a connect-time refusal from a
# `reqwest` error chain **by type**. `health` has to tell a refusal apart from an
# unreachable host — the two mean opposite things in a report — and until now it
# did that by matching the sentence the refusal rendered. 0.1.5 changed that
# sentence (the guard moved crates), which is exactly the failure mode a string
# match has: every refusal would have been silently downgraded to "unreachable".
#
# Not a new crate in the graph: `affinidi-did-web` and `affinidi-tdk-common`
# already pull this exact version, so naming it adds a requirement and nothing
# else. `openvtc-core::net_guard` deliberately stays as it is — it classifies a
# host *as written in the URL*, and this crate's classifier refuses a wider set
# (documentation, multicast and reserved space, `*.internal`, single-label
# names), which is a behaviour change to make on its own rather than inside a
# dependency bump.
affinidi-net-guard = "0.1.0"
anyhow = "1.0"
# Structure-aware fuzzing support (issue #124). Only pulled in when a crate
# enables its own `arbitrary` feature; the `derive` feature provides the
# `#[derive(arbitrary::Arbitrary)]` proc-macro.
arbitrary = { version = "1", features = ["derive"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23"
bip39 = "2.2"
byteorder = "1.5"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
crossterm = { version = "0.29", features = ["event-stream"] }
# Held at 6 deliberately, not merely unrefreshed. `vta-sdk` and `did-git-sign`
# both declare `^6`, and this is the only line that could split them — the graph
# currently holds exactly one `dirs` and moving to 7 alone would make it two,
# for a release whose sole breaking change is `preference_dir` resolving to
# `RoamingAppData` rather than `LocalAppData` on Windows. We call `home_dir` and
# `config_dir`, neither of which moved, so a second copy would buy nothing and
# risk this workspace and the sdk disagreeing about where a path is. It follows
# the stack up when the stack goes.
dirs = "6.0"
dialoguer = { version = "0.12", features = ["password"] }
# 0.7 is the release that carries the resolution host policy the cache SDK above
# now configures: `localhost`, `*.localhost`, `*.local`, `*.internal`,
# `home.arpa` and single-label names are refused before any request, the default
# client vets every address a name resolves to and connects only to those, and
# it ignores `HTTP_PROXY`/`HTTPS_PROXY` (a proxy resolves the name itself, past
# the check). This line moves with `affinidi-did-resolver-cache-sdk`, not
# independently: the SDK's 0.8.37 requires `^0.7`, so a `"0.6"` here would put a
# second copy in the graph for nothing.
#
# What this workspace uses from the crate is unaffected by the move: `WebVHURL`,
# `create_did`/`CreateDIDConfig`, `Parameters`, `LogEntryMethods` and
# `DIDWebVHError` are unchanged (`DIDWebVHError` is `#[non_exhaustive]` and
# gained `BlockedHost`, which `OpenVTCError::WebVH` carries through by `#[from]`
# rather than matching on).
#
# **The second copy has narrowed to one cause, the same one as the second sdk.**
# It was 0.6.1, held by every VTI crate declaring `didwebvh-rs = "0.6"`, which
# excludes 0.7. `vta-sdk` 0.38 declares `^0.7` and `vta-service` 0.27 does too,
# so the published closure no longer holds it. What remains is `vta-sdk` 0.36.0,
# and the only thing pulling *that* is `did-git-sign` 0.4.9 — so this row and the
# second sdk are now the same obligation with two names, and both close on a VGI
# release. Nothing crosses between the two copies (VTI's use is minting and
# log-entry work behind its own API, and no didwebvh-rs type appears in a
# signature this workspace calls), so it costs a `cargo tree -d` row rather than
# a build failure. `cargo tree -i didwebvh-rs` is the check: the **resolution**
# path (`affinidi-did-resolver-cache-sdk`) must be the 0.7 node, and after the
# VGI release there should be no other.
didwebvh-rs = "0.7"
ed25519-dalek-bip32 = "0.3"
hkdf = "0.13"
hex = "0.4"
# poll(2) with a timeout, for asking the terminal its background colour
# (`openvtc::theme::terminal`). Already in the graph beneath crossterm and
# console; named directly because neither exposes a timed read.
libc = "0.2"
# keyring split: the library API is now in keyring-core 1.0; platform
# backends ship as separate keyring-store crates that each binary registers
# at startup via keyring_core::set_default_store.
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Linux gets two backends, not one. Secret Service is the durable desktop
# store; keyutils is the kernel keyring, which is RAM-only by design and is
# now only a fallback for profiles we may not write to disk. See
# `openvtc::linux_store`. dbus-secret-service (rather than the zbus variant)
# because affinidi-tdk-common already pulls it in — one Secret Service client
# in the graph, and a synchronous one, which suits our blocking save path.
dbus-secret-service-keyring-store = "1"
linux-keyutils-keyring-store = "1"
windows-native-keyring-store = "1"
multibase = "0.9"
pgp = "0.20"
# Ticket QR codes on the Vetting page. Default features off: they pull `image`
# for PNG/SVG output, and all the page needs is the module matrix, drawn with
# Unicode half-blocks. MIT OR Apache-2.0 with no dependencies of its own, so
# `deny.toml` needs nothing new.
qrcode = { version = "0.14", default-features = false }
# Stays on 0.8 because pgp 0.20 does: it takes an `R: Rng + CryptoRng` from
# the rand_core 0.6 trait set for key signing / `set_password` / ESK
# encryption, and we hand it our `OsRng` directly, so the two must agree.
# rand 0.10 also drops `OsRng` outright. Re-evaluated 2026-08-09: pgp 0.20.0
# still declares `rand ^0.8.6`, and ed25519-dalek-bip32 0.3.0 is still the
# latest release. aes-gcm no longer holds this pin — it moved to 0.11 and its
# one RNG call site now fills the nonce from `rand`'s OsRng directly rather
# than going through `AeadCore::generate_nonce`.
#
# Dependabot proposed 0.10 anyway and it merged (#314), which stopped `main`
# compiling: 0.10 replaces `OsRng` with the fallible `rngs::SysRng` and splits
# `RngCore` into `Rng`/`TryRng`, so all four call sites here fail to resolve,
# and `pgp`'s `encrypt` still wants a rand 0.8 `CryptoRng + Rng` regardless.
# There is no newer `pgp` to move to — 0.20.0 is the latest release and
# declares `rand ^0.8.6`, and `openpgp-card-rpgp` 0.8.1 pins `pgp ^0.20` —
# so the pin stays until the OpenPGP stack moves. `rand` is in Dependabot's
# ignore list for that reason; delete both together, not this line alone.
rand = "0.8"
ratatui = "0.30"
regex = "1.12"
secrecy = { version = "0.10", features = ["serde"] }
serde = "1.0"
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
sysinfo = "0.39"
thiserror = "2.0"
tokio = "1.52"
toml = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned to the line the VTA/VTC themselves build against, NOT independently
# chosen. `TrustTask` crosses the vta-sdk boundary in both directions — we hand
# one to `submit`, and `capabilities` classifies the ones a VTC advertises — so
# our copy has to be the same crate version vta-sdk resolves, or the two are
# distinct types that do not unify.
#
# Moved 0.19 → 0.20 when vta-sdk went to 0.36, as it moved 0.18 → 0.19 for 0.35,
# 0.17 → 0.18 for 0.34, 0.9 → 0.11 for 0.27, 0.6 → 0.9 for 0.25 and 0.4 → 0.6 for 0.23.3. This is a
# *follow*, not a lead: holding an older line here stops matching the stack and
# starts splitting the type — on the 0.4 → 0.6 move a `cargo update` alone put
# 0.4.1 and 0.6.5 in the same binary, which is the exact failure the paragraph
# above exists to prevent. `cargo tree -d` is the check: two `trust-tasks-rs`
# rows means this pin has drifted from vta-sdk's again, whichever direction it
# drifted.
#
# The patch is named because vta-sdk 0.38 declares `^0.20.4`, not a bare `^0.20`
# — a floor below what the sdk itself requires is a floor that does nothing.
# 0.20.4 is the release the whole published VTI stack is built on (`vta-sdk`
# 0.38, `vta-service` 0.27, `vtc-client` 0.6.2, `vti-common` 0.18.5 all declare
# it), and it is the release that *generates* the vetting wire types the sdk now
# re-exports. So this line is forced by the graph rather than chosen here: the
# generated types reach this repo through `vta_sdk::protocols::vetting`, and a
# `trust-tasks-rs` a patch behind would re-export a different set of them.
#
# `trust-tasks-capability-client` moves with it for the same reason — it
# re-exports the same `TrustTask`. Upstream releases the six siblings as one
# event for exactly this reason (trust-tasks-tf #250, where a sibling left
# behind produced `expected TrustTask<Value>, found a different
# TrustTask<Value>`), and on this line the two crates share a version number.
#
# Note the check has to include the **dev** graph. On the 0.6 → 0.9 move the
# shipped graph was clean while `cargo tree -d -e normal,build,dev` still showed
# two, because `openvtc-core` dev-depends on `vta-service` for `MockVta` and
# that pin was a line behind. See its note in `openvtc-core/Cargo.toml`. Since
# the 0.9 → 0.11 move a third and fourth crate have had to follow as well: the
# messaging stack carries `trust-tasks-rs` types in its own API, so
# `affinidi-messaging-sdk` (above) and the `affinidi-messaging-test-mediator`
# dev-dependency both have to sit on the line built against it.
trust-tasks-rs = "0.20.4"
trust-tasks-capability-client = "0.20.4"
tui-input = "0.15"
url = "2.5"
uuid = { version = "1.23", features = ["v4", "fast-rng", "serde"] }
# The 0.38 line — the published release the rest of the VTI stack is built on
# (`vta-service` 0.27, `vtc-client` 0.6.2, `vti-common` 0.18.5), and the one that
# declares `trust-tasks-rs ^0.20.4`. As always this pin *follows* the VTA rather
# than leading it; see the `trust-tasks-rs` note above for why the two versions
# cannot be chosen independently.
#
# 0.38 itself adds one thing this workspace should know about: the resolver
# refuses `did:webvh` resolution to non-public hosts by default (VTI #1448).
# That is the same rule this repo took in #312, so it is a floor moving under a
# behaviour already adopted rather than a new one arriving.
#
# **0.37 is where the vetting wire types stop being the sdk's own.** VTI #1439
# deleted the hand-written `protocols::vetting` bodies and re-exports the
# generated `trust_tasks_rs::specs` types in their place, so what this repo puts
# on the wire is what the specifications state. For a consumer that is a rewrite
# of the call sites rather than a version bump: the generated structs are
# `#[non_exhaustive]` and built through `X::builder()`, constrained strings are
# newtypes, and `check_shape()` arrives as the `CheckShape` trait. The behaviour
# to know at this level is that the generated types *validate* what the
# hand-written ones accepted — unique lists, claim-type patterns, `urn:uuid` card
# ids, absolute https URIs — so a value the schema refuses now fails here instead
# of being refused by the community after it was sent.
#
# 0.36 was where the `vetting` feature and `protocols::vetting` first landed (VTI
# #1425 onward). It was never resolvable from crates.io as a whole stack, which
# is why this workspace carried a patch block across that line and does not now.
#
# **0.35 refuses an unsigned trust-task reply by default, and that is a
# deployment ordering constraint rather than a code one.** The only API change
# from 0.34.1 is an *addition* — `VtaClient::trusting_unsigned_replies()`, the
# staging hatch — so this bump compiles clean and then fails at runtime against
# an agent that predates VTI #1334/#1335, which sends no proof: every answer is
# refused and the pane reads as a total outage. `vta-service` **0.25.0** is the
# first release that signs; 0.24.1 was published hours before those merged and
# does not. Upgrade the VTA first.
#
# What 0.33 and 0.34 change for this repo is the *shape* of the wire types
# rather than any behaviour of its own. VTI #1270/#1271 made the growth-prone
# request/response bodies `#[non_exhaustive]` — `AclEntry` and `AppStateWrite`
# among them — so a struct literal outside the sdk no longer compiles and the
# constructor is the only way in. That is a deliberate constraint rather than an
# inconvenience: on `AclEntry`, an absent `allowed_keys` and a present-but-empty
# one are OPPOSITE grants (absent reaches every key the entry's scopes reach,
# empty reaches none), and a literal is exactly how a member added later gets
# defaulted to the wrong one of the two.
#
# VTI #1280 then replaced `create_acl`'s positional argument list with
# `CreateAclParams`, so an entry can be created already narrowed instead of
# being narrowed by a second call. The window that closes is real: between the
# grant and the narrowing the entry holds everything its role implies, and a
# subject that authenticates inside it is authorized by what it found there.
#
# 0.34 also adds `room_present` / `room_open` (VTI #1285), the member half of
# the rooms oracle. Nothing here calls them yet.
#
# Older floor notes are gone with their lines and kept in git history rather than
# as a wall of satisfied constraints. Each recorded a defect this repo had no
# lever over: 0.32's Trust-Task dispatch identity (VTI #1184/#1192 — both DIDComm
# and TSP transports built every client with `identity: None`, so a dispatched
# task carried no issuer, no recipient and no proof) and its
# `provision/integration` 0.3 cut (VTI #1200/#1202, which killed setup's last
# step on every fresh install); 0.31's mandatory `ClientIdentity`; 0.27's
# Trust-Task response decode (VTI #1033, `basePath` vs `base_path`); 0.25's
# `CreateKeyRequest.internal` (VTI #995); 0.23's
# `CreateDidWebvhRequest.add_tsp_service` (VTI #959, the field that lets a minted
# persona advertise `#tsp` at all); and the 0.21.x line's
# `provision/integration/0.2` casing (VTI #917) and `null` `CreateKeyBody`
# members (VTI #919).
#
# The graph holds exactly one `vta-sdk` and one `trust-tasks-rs`, and keeping it
# that way is the whole cost of this pin. `vta-sdk` is a 0.x crate, so `"0.32"`
# *excludes* 0.34: every consumer edge that declares its own requirement has to
# move in the same change, or the workspace carries two sdks. That is not merely
# untidy — `vti-common` re-exports `vta_sdk::acl::{ActScope, ApproveScope,
# ContextDirection}` as its own public API, so the two copies carry types that
# cannot unify, and in practice the build fails outright rather than mis-typing.
#
# There are two such edges, and on this line they do not move together:
#
# - `vta-service`, which `openvtc-core` dev-depends on for `MockVta`. **0.27 is
#   published and built on 0.38**, so the dev graph resolves from crates.io
#   again. Dev-only, which is exactly why it gets forgotten — the *shipped*
#   graph looks clean while the harness tests this client against a server it is
#   no longer paired with.
# - `did-git-sign`, the standing obligation, **unsatisfied on this line and not
#   fixable from here**. 0.4.9 is the newest release and requires `vta-sdk
#   ^0.36`, so the graph carries a second sdk: 0.38.0 for this workspace, 0.36.x
#   beneath `did-git-sign`. A `[patch]` cannot close it — 0.4.9 was cut from VGI
#   `main`, so there is no newer commit to point at. It blocked six consecutive
#   minors before this one (0.23, 0.25, 0.27, 0.31, 0.32, 0.34) and 0.35 was the
#   only line it did not.
#
#   The duplicate costs a `cargo tree -d` row rather than a build failure, and
#   the reason is narrow enough to be worth stating: we use
#   `did_git_sign::{config, init}` only, so no sdk type crosses that boundary.
#   One new import is all it would take. **VGI `main` is already on 0.38** (VGI
#   #51), so what remains is a VGI *release*: when one is cut, the floor in
#   `openvtc/Cargo.toml` moves to it and this row disappears.
#
# `trql-client`, the third git-pinned edge in this ecosystem, does **not**
# depend on `vta-sdk` at all, so the trust registry needs no release for an sdk
# bump. It is published at 0.17 now, which is what let VGI release at all —
# `cargo publish` rejects a git dependency outright.
#
# **The floor names the patch, never a bare minor**, wherever a specific release
# is what makes the line viable — a caret that admits a broken or duplicate-
# reintroducing release lets a clean checkout resolve straight back onto it. On
# the 0.32 line that was 0.32.1/0.32.2 (VTI #1200/#1202: `provision/integration`
# had been cut to 0.3 while three of the four dispatch runners still sent 0.2 or
# 0.1, so setup's last step died with `unsupportedType` against a healthy VTA,
# and the reply came back labelled with a schema it could not satisfy). On this
# line the patch names 0.34.1, and it is a floor rather than a record: 0.34.0
# has neither `persona/facet/*` nor `persona/claim-types/list`, and the identity
# pane now calls both. On 0.34.0 the pane compiles and then cannot find the
# constants; naming the patch is what turns that into a resolver error at the
# point where it can be read.
vta-sdk = { version = "0.38", features = [
  "session",
  "client",
  # The SAME per-platform credential-store registration pnm-cli uses
  # (`vta_sdk::keyring_init::install_default_store`), so every tool in the
  # workspace puts secrets in the same place on the same OS. Pulls the
  # apple-native / windows-native / dbus-secret-service store crates.
  "keyring",
  "didcomm",
  "provision-client",
  # Peer identity vetting: the Vetting Card and Statement, their verification,
  # requirement evaluation and the session match code
  # (`docs/design/vetting-process.md`). The wire types the feature operates on
  # are generated and always compiled — `protocols::vetting` is not behind it.
  "vetting",
  # Routes the Trust-Task surface over TSP as a leg of the existing DIDComm
  # session (VTI #803 / #810) — no second socket, no second mediator connection.
  # This arrived across 0.20.2–0.20.6 (the leg itself, then the
  # resolver-injection seam the discovery tests need per VTI #813, then its
  # export from `provision_client` rather than the inner `resolve` module per
  # VTI #825); all of it is carried forward by the 0.21 line.
  "tsp",
  # DCQL credential selection + holder-bound OID4VP `vp_token` assembly
  # (`vta_sdk::vp`), for answering a VTC's `credential-exchange/query`.
  "vp",
] }
reqwest = { version = "0.13", features = ["json"] }
# Held at 2.x by the OpenPGP stack: pgp 0.20 and openpgp-card-rpgp 0.8 both
# declare `x25519-dalek ^2`, and we hand our `StaticSecret` straight to pgp's
# `ecdh::SecretKey::Curve25519Legacy` — a 3.x secret is a different type there
# and would not compile. 3.0 also moves to curve25519-dalek 5 / rand_core 0.10.
#
# The graph does hold a 3.x copy as well, and that is fine because it is bounded
# and no type crosses: 3.0.0 is reached only through the vta-sdk crypto stack
# (and, in the dev graph, `vti-rooms`' MLS chain), while 2.0.1 is the one our
# `StaticSecret` is handed to. `cargo tree -i x25519-dalek@2.0.1` is where that
# is checked. It collapses when `pgp` releases on 3.x; 0.20.0 is still its
# latest and still declares `^2`.
#
# Dependabot proposed 3.0 and it merged alongside the `rand` bump (#314),
# which stopped the binary compiling exactly as described above: `expected
# x25519_dalek::x25519::StaticSecret, found StaticSecret`. It is in
# Dependabot's ignore list with `rand`; lift both when `pgp` moves.
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.8"

# Openpgp-Card Support
openpgp-card = "0.7"
card-backend-pcsc = "0.5"
openpgp-card-rpgp = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"


# No `[patch.crates-io]`.
#
# The block that stood here carried two repositories across one release each, and
# both releases have landed: VTI published `vta-sdk` 0.37 with the whole
# `vta-service` 0.26 closure behind it — since superseded by 0.38 and 0.27, which
# is what these floors now name — and VGI published `did-git-sign` 0.4.9.
# So every dependency resolves from crates.io and the block is deleted rather
# than left empty, so that adding one back is a visible decision.
#
# What the unwind did *not* buy is the thing a patch block is usually kept for.
# `did-git-sign` 0.4.9 requires `vta-sdk ^0.36` against this workspace's 0.38, so
# the graph still holds two sdks — and a patch is no longer the lever, because
# VGI `main` is the commit 0.4.9 was cut from. The `vta-sdk` note above has the
# detail; the fix is a VGI release, not an entry here.
#
# `deny.toml`'s `allow-git` list is the other half of every entry, and is empty
# again too. The two are edited together: `unknown-git = "deny"` means a patch
# added here without an entry there fails `cargo deny check sources`, and nothing
# in either file points at the other. Adding one back means adding it in both
# places, and writing down here what has to happen for it to leave again — the
# entries removed each carried that note, and it is the only reason this unwind
# and the one before it were tractable.
