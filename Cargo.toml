[workspace]
members = [
  "openvtc-core",
  "openvtc",
]
resolver = "3"

[workspace.lints.rust]
# The one exception is the `libc::poll` in `openvtc::theme::terminal`, which
# carries its own `#[allow(unsafe_code)]`.
unsafe_code = "deny"

[workspace.package]
version = "0.8.0"
edition = "2024"
publish = true
authors = ["Glenn Gore <glenn@affinidi.com>"]
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/openvtc"

[workspace.dependencies]
openvtc-core = { version = "0.8.0", path = "openvtc-core", default-features = false }

# Follows `vta-sdk`: `DTGCredential` crosses the sdk boundary (the member VMC,
# `messaging::verify_vrc_proof`), so a different line is a second type that does
# not unify. DTG Credentials v1 (0.12+) is not wire-compatible with earlier
# lines, so VTI, trust-tasks and this client move together. Check: one
# `dtg-credentials` node in `cargo tree -i`.
dtg-credentials = "0.13"

aes-gcm = "0.11"
# Derives the unlock-code and `ProtectedConfig` keys with `hash_password_into`
# (plain Argon2id), so the output does not change across 0.5 and 0.6. The 0.5
# copy in the graph comes from `pgp` and is not ours to move.
argon2 = "0.6"
# Follows `vta-sdk`: the `affinidi-tdk` line the pinned `vta-sdk` declares, or
# the graph holds two TDKs.
affinidi-tdk = "0.37"
affinidi-data-integrity = "0.8"
# Decodes a community's Bitstring Status List (`openvtc-core::status_list`);
# `vta-sdk`'s own reader cannot verify a list signed with a proof set.
affinidi-status-list = "0.1"
# The delivery layer: `-delivery` is the durable outbox + `MessagingService`,
# `-core` the `MessageTransport` contract, `-sdk` the DIDComm transport (which
# also surfaces inbound TSP on the same socket). Floor 0.1.20: acks are bounded
# and never delete a message no subscriber took (affinidi-tdk-rs #710, #927).
affinidi-messaging-delivery = "0.1.20"
# Needs >= 0.1.6: the inbound dispatcher's wildcard arm relies on `Protocol`
# being `#[non_exhaustive]`.
affinidi-messaging-core = "0.1.11"
# Carries `trust-tasks-rs` types in its own API, so it must be the line built on
# the `trust-tasks-rs` / `vta-sdk` pinned here; any other line is a second,
# non-unifying `trust-tasks-rs`. Check: one node each in `cargo tree -i`.
affinidi-messaging-sdk = "0.45.0"
# `StreamExt::next` on the `BoxStream` from `MessagingService::subscribe`.
futures-util = "0.3"
# Agent names: parse, canonicalise and match `alsoKnownAs` (see `CLAUDE.md`).
# Not below `vta-sdk`'s own requirement.
agent-names = "0.1.3"
# The `agent-names` feature (not default) provides `DIDCacheClient::resolve_any`.
# The patch is a floor: 0.8.37 refuses did:webvh fetches to non-public hosts,
# 0.8.39 refuses a deactivated did:webvh, 0.8.43 resolves did:scid natively.
affinidi-did-resolver-cache-sdk = { version = "0.8.43", features = [
  "agent-names",
] }
# `guarded_dns_resolver`, so `health`'s probe client applies the resolver's own
# SSRF guard. Moves with the resolver: one node in the graph.
affinidi-did-web = "0.1.5"
# `blocked_in_chain`, so `health` recognises a guard refusal by type rather than
# by its message. The node `affinidi-did-web` and `affinidi-tdk-common` use.
affinidi-net-guard = "0.1.0"
anyhow = "1.0"
# `#[async_trait]` for the `RelationshipKv` backend behind the SDK's
# `PersistentRelationshipStore`; the trait is declared with the same macro.
async-trait = "0.1"
# Structure-aware fuzzing (`openvtc-core`'s optional `arbitrary` feature).
arbitrary = { version = "1", features = ["derive"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23"
bip39 = "3.0"
byteorder = "1.5"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
crossterm = { version = "0.29", features = ["event-stream"] }
# Same major as `vta-sdk` and `did-git-sign`, so they agree on where config
# paths live. Check: one `dirs` node.
dirs = "7.0"
# The commit signer (Verifiable Git Infrastructure). Each VGI release is built
# on one `vta-sdk` line; this must be the release on the line pinned below, or
# the graph holds two sdks (`git_signing` hands it a `VtaClient`). `vgi-core` is
# always the same release as `did-git-sign`.
did-git-sign = "0.33.0"
vgi-core = "0.33.0"
dialoguer = { version = "0.12", features = ["password"] }
# Must be the node the resolver uses (`cargo tree -i didwebvh-rs`: one node).
# 0.8.1+ mints a did:webvh with its did:scid presentation. All DID <-> URL
# handling goes through this crate (see `CLAUDE.md`).
didwebvh-rs = "0.8.2"
ed25519-dalek-bip32 = "0.3"
hkdf = "0.13"
hex = "0.4"
# poll(2) with a timeout, to ask the terminal its background colour
# (`openvtc::theme::terminal`); crossterm and console expose no timed read.
libc = "0.2"
# keyring-core is the API. The platform stores (Keychain, Credential Manager,
# Secret Service) are registered by `vta_sdk::keyring_init::install_default_store`,
# so every VTI tool uses the same store. keyutils (RAM-only) is only the
# `OPENVTC_SECURE_STORE=keyutils` migration path on Linux.
keyring-core = "1"
linux-keyutils-keyring-store = "1"
multibase = "0.9"
# Must be the `pgp` line `openpgp-card-rpgp` requires (0.8 -> `^0.20`): the
# card's `CardSlot` implements that line's key traits, so the two move in one
# change (0.9 / 0.21 are both on rand 0.8 and x25519-dalek 2). In Dependabot's
# ignore list with `rand` and `x25519-dalek`.
pgp = "0.20"
# Default features off: only the module matrix is needed (drawn with
# half-blocks), not `image` output.
qrcode = { version = "0.14", default-features = false }
# Held at 0.8 by `pgp` 0.20, which takes an `R: CryptoRng + Rng` from the
# rand_core 0.6 traits; our `OsRng` is handed to it directly. Moves with `pgp`.
rand = "0.8"
ratatui = "0.30"
secrecy = { version = "0.10", features = ["serde"] }
serde = "1.0"
serde_json = "1.0"
serde_json_canonicalizer = "0.4"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
# Constant-time comparison of admission tickets (`vetting::tickets`).
subtle = "2.6"
# Two call sites: `System::host_name` and a single-PID liveness check
# (`process_lock`). Both need only the `system` feature.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
thiserror = "2.0"
# The runtime features the code uses. Tests add `net`, `io-util` and
# `test-util` in the crates' dev-dependencies.
tokio = { version = "1.52", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Follows `vta-sdk`: `TrustTask` and the generated wire types cross the sdk
# boundary, so this must be the line `vta-sdk` resolves, and
# `trust-tasks-capability-client` (which re-exports `TrustTask`) the same line.
# Runtime only: the specs this workspace speaks are generated by
# `openvtc-core/build.rs` (`openvtc_core::specs`), so no prebuilt spec family is
# enabled. Check: one node each, dev graph included (`-e normal,build,dev`).
trust-tasks-rs = { version = "0.37.2", default-features = false }
trust-tasks-capability-client = "0.37.2"
# Build dependency of `openvtc-core`: generates `openvtc_core::specs` from the
# vendored bundles pinned in `openvtc-core/trust-tasks.lock`.
trust-tasks-build = "0.1.2"
tui-input = "0.15"
url = "2.5"
uuid = { version = "1.23", features = ["v4", "fast-rng", "serde"] }
# The VTA client. The graph must hold exactly one `vta-sdk`: `vti-common`
# re-exports sdk types, so two copies fail to build. Every edge that declares
# its own requirement moves in the same change: `did-git-sign` / `vgi-core`
# above, and `vta-service`, `vti-vetting-pcs`, `vti-voting` and
# `affinidi-messaging-test-mediator` in `openvtc-core`'s dev-dependencies; so do
# `trust-tasks-rs`, `affinidi-tdk`, `affinidi-messaging-sdk` and
# `dtg-credentials`. Name the patch when a specific release is what makes the
# line work. Check: `cargo tree -d -e normal,build,dev`.
vta-sdk = { version = "0.80.0", features = [
  "session",
  "client",
  # Registers the same per-platform credential store as the other VTI tools
  # (`vta_sdk::keyring_init::install_default_store`).
  "keyring",
  "didcomm",
  # Opens this client's own mediator inbox on connect; without it a closed
  # (ExplicitAllow) mediator drops every VTA reply.
  "acl-setup",
  "provision-client",
  # Peer identity vetting: Vetting Card / Statement, verification and the
  # session match code. The wire types are generated and always compiled.
  "vetting",
  # The Trust-Task surface over TSP, as a leg of the DIDComm session.
  "tsp",
  # DCQL credential selection + OID4VP `vp_token` assembly (`vta_sdk::vp`).
  "vp",
] }
reqwest = { version = "0.13", features = ["json"] }
# Held at 2.x by the OpenPGP stack: our `StaticSecret` goes straight to `pgp`'s
# `ecdh::SecretKey::Curve25519Legacy`. The 3.x copy in the graph comes from the
# TDK crypto stack (`affinidi-crypto`) and no type crosses between the two.
# Moves with `pgp`.
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.8"

# OpenPGP card support (the default `openpgp-card` feature).
openpgp-card = "0.7"
card-backend-pcsc = "0.5"
openpgp-card-rpgp = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# No `[patch.crates-io]`: everything resolves from crates.io. A git patch also
# needs a matching `allow-git` entry in `deny.toml` (`unknown-git = "deny"`), and
# a note on what has to happen for both to be removed again.
